name: Build Desktop Distributions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build MSI Installer
        run: ./gradlew :desktopApp:packageMsi

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-ssh-terminal-windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Install Debian Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Ubuntu DEB Package
        # Первая команда дает права на запуск, вторая — собирает проект
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDistributionForCurrentOS
      

      - name: Upload Ubuntu DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-ssh-terminal-ubuntu
          path: desktopApp/build/compose/binaries/main/deb/*.deb
