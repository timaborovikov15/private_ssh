# Настройка сборки для Ubuntu Linux (.DEB)
build-linux:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Install Debian Packaging Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot dpkg-dev

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Ubuntu DEB Package
      run: ./gradlew :desktopApp:packageDistributionForCurrentOS

    - name: Upload Ubuntu DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: private-ssh-terminal-ubuntu
        path: desktopApp/build/compose/binaries/main/deb/*.deb
